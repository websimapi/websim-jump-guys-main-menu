<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Jump Guys — Main Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="app">
    <!-- Top Left: PFP + username -->
    <button class="pfp" id="pfpBtn" aria-label="User Profile">
      <img id="pfpImg" alt="User avatar" />
      <div class="pfp-meta">
        <div class="pfp-username" id="pfpUsername">@guest</div>
        <div class="pfp-sub" id="pfpSub">Lvl 1 • 0 crowns</div>
      </div>
    </button>

    <!-- Top Right: Settings -->
    <button class="icon-btn settings-btn" id="settingsBtn" aria-label="Settings">
      <span aria-hidden="true">⚙</span>
    </button>

    <!-- Center: Character Stage -->
    <main class="stage">
      <canvas id="stageCanvas" aria-label="Character showcase"></canvas>
    </main>

    <!-- Bottom Right: PLAY -->
    <button class="play-btn" id="playBtn" aria-label="Play">PLAY</button>

    <!-- Settings Drawer -->
    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-header">
        <h2>Settings</h2>
        <button class="icon-btn" id="drawerClose" aria-label="Close settings">✕</button>
      </div>
      <div class="drawer-content">
        <label class="row">
          <span>Music</span>
          <input type="checkbox" id="musicToggle">
        </label>
        <label class="row">
          <span>SFX</span>
          <input type="checkbox" id="sfxToggle">
        </label>
        <div class="row">
          <span>Graphics</span>
          <div class="segmented" role="tablist" aria-label="Graphics Quality">
            <button role="tab" data-q="low">Low</button>
            <button role="tab" data-q="medium" class="active">Medium</button>
            <button role="tab" data-q="high">High</button>
          </div>
        </div>
        <div class="hint">Settings are saved automatically.</div>
      </div>
    </aside>

    <!-- Scrim -->
    <div class="scrim" id="scrim" aria-hidden="true"></div>
  </div>

  <script type="module" src="./main.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
